name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate Supabase secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY são obrigatórios."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            *placeholder*|*SEU_PROJETO*) echo "::error::VITE_SUPABASE_URL parece placeholder."; exit 1 ;;
          esac
          case "$VITE_SUPABASE_ANON_KEY" in
            placeholder|*sua_chave_anon*) echo "::error::VITE_SUPABASE_ANON_KEY parece placeholder."; exit 1 ;;
          esac

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /contrato-estetica/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
