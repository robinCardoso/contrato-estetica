<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Contratos Estéticos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #f3f4f6; }
    .signature-box { height: 140px; border: 1px dashed #9ca3af; border-radius: 8px; background: #f9fafb; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
  <div class="max-w-3xl mx-auto">
    <header class="mb-6 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Contratos Estéticos</h1>
        <p class="text-sm text-slate-500">Área da profissional</p>
      </div>
      <button id="btn-logout" class="hidden text-sm text-slate-600 hover:text-slate-900 underline">Sair</button>
    </header>

    <div id="alert-box" class="hidden mb-4 rounded-lg border px-4 py-3 text-sm"></div>

    <section id="login-section" class="bg-white rounded-xl shadow-sm border p-6">
      <h2 class="font-semibold text-slate-800 mb-4">Entrar</h2>
      <form id="login-form" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">E-mail</label>
          <input id="login-email" type="email" required class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Senha</label>
          <input id="login-password" type="password" required minlength="6" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <button type="submit" class="w-full bg-slate-900 text-white rounded-lg py-2 text-sm font-medium">Entrar</button>
      </form>
    </section>

    <section id="app-section" class="hidden space-y-6">
      <div id="edit-banner" class="hidden rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900 flex items-center justify-between gap-3">
        <span id="edit-banner-text">Editando contrato</span>
        <button type="button" id="btn-cancel-edit" class="text-xs font-medium underline hover:text-amber-700 shrink-0">Cancelar</button>
      </div>

      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 id="form-title" class="font-semibold text-slate-800 mb-4">Novo contrato</h2>
        <form id="contract-form" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Identificação interna (opcional)</label>
            <input id="patient-label" type="text" placeholder="Ex.: Maria — harmonização" class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>

          <div class="grid sm:grid-cols-2 gap-3">
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-slate-500 mb-1">Procedimento(s)</label>
              <input id="plano-procedimentos" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-slate-500 mb-1">Região(ões)</label>
              <input id="plano-regioes" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-slate-500 mb-1">Equipamento/Produto</label>
              <input id="plano-equipamentos" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Sessões</label>
              <input id="plano-sessoes" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Disparos</label>
              <input id="plano-disparos" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-slate-500 mb-1">Ampolas/Seringas/Frascos</label>
              <input id="plano-ampolas" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Valor total (R$)</label>
              <input id="valor-total" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="0,00">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Forma de pagamento</label>
              <input id="plano-pagamento" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Dia</label>
              <input id="dia" class="w-full border rounded-lg px-3 py-2 text-sm text-center">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Mês</label>
              <input id="mes" class="w-full border rounded-lg px-3 py-2 text-sm text-center">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Ano</label>
              <input id="ano" class="w-full border rounded-lg px-3 py-2 text-sm text-center">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-2">Sua assinatura</label>
            <canvas id="sig-canvas" class="signature-box w-full touch-none"></canvas>
            <div class="flex flex-wrap gap-2 mt-2">
              <button type="button" id="btn-clear-sig" class="text-xs border rounded-lg px-3 py-1.5 hover:bg-slate-50">Limpar assinatura</button>
              <button type="button" id="btn-load-sig" class="text-xs border rounded-lg px-3 py-1.5 hover:bg-slate-50">Usar assinatura salva</button>
              <button type="button" id="btn-upload-sig" class="text-xs border rounded-lg px-3 py-1.5 hover:bg-slate-50">Carregar foto da assinatura</button>
              <button type="button" id="btn-save-sig" class="text-xs border rounded-lg px-3 py-1.5 hover:bg-slate-50">Salvar assinatura no perfil</button>
              <input type="file" id="sig-file-input" accept="image/png,image/jpeg,image/jpg" class="hidden">
            </div>
            <p class="text-xs text-slate-400 mt-1">PNG ou JPG. A imagem é redimensionada automaticamente.</p>
          </div>

          <button type="submit" id="btn-create" class="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium">
            Gerar link para paciente
          </button>
        </form>

        <div id="link-result" class="hidden mt-4 p-4 bg-emerald-50 border border-emerald-200 rounded-lg">
          <p class="text-sm font-medium text-emerald-800 mb-2">Link gerado com sucesso!</p>
          <div class="flex gap-2">
            <input id="generated-link" readonly class="flex-1 border rounded-lg px-3 py-2 text-xs bg-white">
            <button type="button" id="btn-copy-link" class="bg-emerald-700 text-white rounded-lg px-3 py-2 text-xs font-medium">Copiar</button>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="font-semibold text-slate-800 mb-4">Contratos recentes</h2>
        <div id="contracts-list" class="space-y-2 text-sm text-slate-600"></div>
      </div>
    </section>
  </div>

  <div id="view-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
    <div class="bg-white rounded-xl shadow-xl border max-w-lg w-full max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b px-5 py-4 flex items-center justify-between gap-3 rounded-t-xl">
        <h3 class="font-semibold text-slate-800">Contrato assinado</h3>
        <button type="button" id="btn-close-view" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
      </div>
      <div id="view-modal-body" class="p-5 space-y-4 text-sm"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script type="module" src="/src/js/admin.js"></script>
</body>
</html>
